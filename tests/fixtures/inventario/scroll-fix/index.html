<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Scroll fix fixture</title>
<style>.titulo { opacity: 0; animation: entrar 1s forwards; } @keyframes entrar { to { opacity: 1; } }</style>
<style data-scroll-fix="true">html, body { overflow: auto !important; } .opacity-0 { opacity: 1 !important; }</style>
</head>
<body><section><h1 class="titulo">Old capture</h1></section></body>
</html>
